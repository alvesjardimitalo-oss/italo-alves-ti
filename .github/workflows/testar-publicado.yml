name: Testar site publicado

on:
  pull_request:
    paths:
      - 'tools/site/testar-publicado.mjs'
      - '.github/workflows/testar-publicado.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Testar site público (sem escrever no Firestore real)
        env:
          SITE_URL: https://italoinfotec.com.br/
        run: node tools/site/testar-publicado.mjs
      - name: Salvar capturas para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-site-publicado
          path: test-results/
          if-no-files-found: ignore
