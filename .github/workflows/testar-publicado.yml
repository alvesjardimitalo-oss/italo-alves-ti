name: Testar site publicado

on:
  pull_request:
    paths:
      - 'tools/site/testar-publicado.mjs'
      - '.github/workflows/testar-publicado.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-browser:
    # ubuntu-latest passou a ser 26.04, ainda sem suporte do Chromium do Playwright 1.56.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Conferir publicação da otimização (sitemap, fontes, CSS mobile)
        env:
          SITE_URL: https://italoinfotec.com.br/
        run: |
          set -e
          curl -fsS "${SITE_URL}sitemap.xml" | grep -q 'desenvolvimento/' && echo 'OK sitemap com desenvolvimento/'
          curl -fsS "$SITE_URL" | grep -q 'media="print" onload=' && echo 'OK fontes sem bloquear'
          curl -fsS "${SITE_URL}assets/css/site.css" | grep -q '.artigo .btn' && echo 'OK CSS mobile publicado'
          curl -fsS "$SITE_URL" | grep -q 'icon-512.png", "logo"' && echo 'OK schema com logo PNG'
      - name: Testar site público (sem escrever no Firestore real)
        env:
          SITE_URL: https://italoinfotec.com.br/
        run: node tools/site/testar-publicado.mjs
      - name: Diagnóstico DNS do novo domínio (informativo)
        if: always()
        run: |
          echo 'A do domínio raiz:'
          dig +short italoinfotec.com.br A || true
          echo 'CNAME do www:'
          dig +short www.italoinfotec.com.br CNAME || true
      - name: Salvar capturas para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-site-publicado
          path: test-results/
          if-no-files-found: ignore
