name: Avaliações do Discord no site

# Todo dia leva para conteudo/avaliacoes.json as avaliações 4 e 5 estrelas que o cliente autorizou no Discord.
# A página inicial lê esse arquivo e mostra a seção "O que dizem os clientes".
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests
      - name: Buscar avaliações autorizadas
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python tools/bots/avaliacoes.py
      - name: Publicar
        run: |
          git config user.name "gerador-do-site"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conteudo/avaliacoes.json
          if git diff --cached --quiet; then echo "Nada mudou."; else git commit -m "Avaliações do Discord no site" && git push; fi
