name: Validar site

on:
  pull_request:
    paths:
      - 'conteudo/**'
      - 'tools/site/**'
      - 'assets/**'
      - '*.html'
      - '.github/workflows/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'sw.js'
      - 'site.webmanifest'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do gerador
        run: python -m py_compile tools/site/gerar.py tools/site/validar.py
      - name: Gerar páginas e conferir links
        run: |
          python tools/site/gerar.py
          python tools/site/validar.py
          git diff --stat
      - name: Testar Alvesinho, diagnósticos e simulador de upgrade
        run: node tools/site/testar-alvesinho.mjs
      - name: Testar painel de conversões, coleta e privacidade
        run: node tools/site/testar-conversoes.mjs
      - name: Testar acesso Google em navegador interno do iPhone
        run: node tools/site/testar-login-ios.mjs
      - name: Testar cache e comportamento offline
        run: node tools/site/testar-sw.mjs
      - name: Testar inicialização segura do Firebase App Check
        run: node tools/site/testar-app-check.mjs
      - name: Verificar sintaxe do JavaScript
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
