name: Gerar site

# Sempre que você editar algo em conteudo/ (pelo GitHub mesmo), as páginas do site são geradas de novo.
on:
  push:
    branches: [main]
    paths:
      - 'conteudo/**'
      - 'tools/site/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-site
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar e gerar páginas
        run: python tools/site/gerar.py
      - name: Salvar páginas geradas
        run: |
          git config user.name "gerador-do-site"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Site gerado automaticamente a partir de conteudo/"
            git push
          fi
